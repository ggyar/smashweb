services:
  - type: web
    name: smashweb
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # Postgres-Verbindungs-URL (z. B. von neon.tech) – wird beim Anlegen abgefragt
