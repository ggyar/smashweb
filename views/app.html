.hero h1{margin:0;font-size:30px;font-weight:900;font-style:italic;letter-spacing:.02em;text-shadow:0 3px 14px #000c;line-height:1}
.hero h1 b{color:var(--ac)}
.hero small{color:#fff;opacity:.85;font-weight:600;text-shadow:0 2px 8px #000}
.tools{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;display:flex;gap:6px}
.tools button{background:#000a;color:#fff;border:1px solid #fff3;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;backdrop-filter:blur(6px)}
.tools button:disabled{opacity:.35}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#12142bee;backdrop-filter:blur(12px);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
#tabs button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;font-weight:700;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button span{font-size:22px;line-height:1;filter:grayscale(1) opacity(.6)}
#tabs button.on{color:#fff}#tabs button.on span{filter:none;transform:translateY(-2px) scale(1.15)}
#app{padding:4px 12px 20px;max-width:700px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 6px 20px #0006}
.card.W{border-top:4px solid var(--W)}.card.L{border-top:4px solid var(--L)}.card.A{border-top:4px solid var(--A)}.card.F{border:2px solid var(--F);background:linear-gradient(160deg,#3a1030,var(--card))}
h2{margin:20px 2px 6px;font-size:19px;font-weight:900;font-style:italic;display:flex;align-items:center;gap:8px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--card2);color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
.pill.W{background:var(--W);color:#2b1d00}.pill.L{background:var(--L);color:#fff}.pill.A{background:var(--A);color:#003322}.pill.F{background:var(--F);color:#fff}
.b{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--card2);color:var(--mut);margin-left:3px;vertical-align:middle}
.b.r{background:var(--ac);color:#fff}.b.p{background:#5b3df5;color:#fff}
.ch{font-size:11px;color:var(--mut);margin-top:2px}

.av.bot{display:inline-flex;align-items:center;justify-content:center}
.pl{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0;font-weight:800;word-break:break-word}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:start}
.vs>b{align-self:center;font-size:22px;font-style:italic;font-weight:900;color:var(--ac);text-shadow:0 0 14px #ff2d5588}
.row{display:flex;gap:8px;margin-top:12px}
.row button,.btn{flex:1;padding:14px 8px;border:0;border-radius:14px;background:linear-gradient(135deg,#ff2d55,#ff6a3d);color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 14px #ff2d5555}
.row button:nth-child(1){background:linear-gradient(135deg,#2d7bff,#2dc5ff);box-shadow:0 4px 14px #2d7bff55}
.btn:disabled{opacity:.35;box-shadow:none}.btn.sec{background:var(--card2);box-shadow:none;color:var(--tx)}
.done{color:var(--ok);font-weight:800;text-align:center;margin-top:10px}
input,select{font:inherit;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 3px;text-align:left}th{color:var(--mut);font-size:10px;text-transform:uppercase}
td.n{text-align:center}tr.top td{font-weight:800}
.pos{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-weight:900;font-size:12px;background:var(--card2)}
.pos.p1{background:#ffc02e;color:#2b1d00}.pos.p2{background:#cfd4e6;color:#222}.pos.p3{background:#d08a4e;color:#2b1500}
.who{display:flex;align-items:center;gap:8px}
.mr{display:grid;grid-template-columns:1fr 50px 10px 50px 1fr;gap:5px;align-items:center;margin-top:8px;font-size:13px;font-weight:600}
.mr input{width:50px;padding:8px 2px;text-align:center;font-weight:800;font-size:16px}
.mr span:first-child{text-align:right}
.mv{border:0;background:var(--card2);color:var(--tx);border-radius:8px;padding:4px 9px;font-size:14px}
.q{font-size:13px;color:var(--mut)}
.rk{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd)}
.rk i{font-style:normal;font-weight:900;width:34px;font-size:18px}
.pod{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;align-items:end;margin:14px 0}
.pod .pl{background:var(--card);border-radius:16px;padding:12px 6px;border:1px solid var(--bd)}
.pod .p1{background:linear-gradient(#5a4300,var(--card));border-color:var(--W);padding-top:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.gd{background:var(--card2);border-radius:12px;padding:9px 11px;margin-top:8px}.gd summary{font-weight:600;font-size:13px}.ge{display:flex;gap:8px;align-items:flex-end;margin-top:8px}.ge label{flex:1;font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:3px}.ge select{width:100%}.ge button{padding:12px 14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:800}.gl{font-size:12px;margin-top:6px}
.mrow{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px}.mrow span:first-child{text-align:right}.mrow.rdy{color:var(--ok);font-weight:700}.mrow.dn{opacity:.8}.mrow.dn b{color:var(--ok)}

<div class="hero"><div class="tools"><button id="undo" onclick="undo()">↩ Zurück</button><button onclick="reset()">⟲ Reset</button></div><h1>SMASH <b>TURNIER</b></h1><small>Super Smash Bros. Ultimate</small></div>
<div id="app"></div><div id="tabs"></div>
<script>
let S=null,H=[],tab='setup';
const $=s=>document.getElementById(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fresh=()=>({phase:'setup',draft:[],nbots:0,players:[],groups:[],gm:[],ord:[],q:{W:[],L:[],A:[]},m:{},lock:[],rank:[],elim:[]});
function load(){try{S=JSON.parse(localStorage.getItem('smash_s'));H=JSON.parse(localStorage.getItem('smash_h'))||[]}catch(e){S=null}
 if(!S||!S.phase){S=fresh();H=[]}if(!S.draft)S.draft=[];if(S.gm.length&&(!S.gm[0].games||!S.lock)){const d=S.draft;S=fresh();S.draft=d;H=[]}}
function persist(){try{localStorage.setItem('smash_s',JSON.stringify(S));localStorage.setItem('smash_h',JSON.stringify(H))}catch(e){}}
function snap(){H.push(JSON.stringify(S));if(H.length>80)H.shift()}
function undo(){if(!H.length)return;S=JSON.parse(H.pop());persist();render()}
function reset(){if(!confirm('Alles zurücksetzen? Das Turnier wird gelöscht.'))return;const d=S.draft,nb=S.nbots;S=fresh();S.draft=d;S.nbots=nb;H=[];tab='setup';persist();render()}

const P=i=>S.players[i];
const SPR=[[680,240],[390,370],[740,510],[200,880],[770,720],[880,640],[70,610],[60,480],[660,600],[880,520],[150,640],[230,350],[830,70],[700,50],[880,150],[780,150],[660,115],[940,370],[800,400],[440,160],[80,270]];
const CN="Mario,Link,Kirby,Pikachu,Fox,Samus,Yoshi,Sonic,Inkling,Mega Man,Ike,Bowser,Pac-Man,Donkey Kong,Villager,Captain Falcon,Ness,Marth,Cloud,Ryu,Diddy Kong".split(',');

function avp(p,z,n){
 if(p.bot)return `<span class="av bot" style="width:${z}px;height:${z}px;font-size:${z*.55}px">🤖</span>`;
 const c=p.ch&&p.ch[0];const ik=NK[c];if(ik&&IC[ik])return `<span class="av" style="width:${z}px;height:${z}px;background:url(${IC[ik]}) center/86% no-repeat,linear-gradient(135deg,#3a4080,#1c1f45)"></span>`;let xy=CS[c];
 if(c&&!xy){let h=0;for(const ch of c)h=(h*31+ch.charCodeAt(0))%360;const ini=c.split(/[\s.&\/-]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
  return `<span class="av bot" style="width:${z}px;height:${z}px;font-size:${z*.38}px;font-weight:900;background:linear-gradient(135deg,hsl(${h} 70% 50%),hsl(${(h+50)%360} 70% 35%))">${esc(ini)}</span>`}
 if(!xy)xy=SPR[n%SPR.length];const k=z/130;
 return `<span class="av" style="width:${z}px;height:${z}px;background-size:${1000*k}px;background-position:${z/2-xy[0]*k}px ${z/2-xy[1]*k}px"></span>`}
const av=(i,z)=>avp(P(i),z,P(i).id);

function tiers(){
 const L=id=>S.m[id].done?[S.m[id].l]:[],W=id=>S.m[id].done?[S.m[id].w]:[],fin=S.phase=='done',f=S.m.GF2.done?S.m.GF2:S.m.GF1;
 return [['1.',fin?[f.w]:[]],['2.',fin?[f.l]:[]],['3.',W('AF')],['4.',L('AF')],['5.',L('AS')],['6.',L('AQ')],['7./8.',[...L('A6-1'),...L('A6-2')]],['9./10.',[...L('A5-1'),...L('A5-2')]],['11./12.',[...L('A4-1'),...L('A4-2')]],['13.–16.',[1,2,3,4].flatMap(i=>L('A3-'+i))],['17.–20.',[1,2,3,4].flatMap(i=>L('A2-'+i))],['21.–24.',[1,2,3,4].flatMap(i=>L('A1-'+i))]].map(([t,a])=>[t,a.filter(isP)]).filter(t=>t[1].length);
}
function vRank0(){
 if(S.phase=='setup')return '<div class="card">Noch kein Turnier gestartet.</div>';
 const T=tiers(),fin=S.phase=='done';
 const pc=(k,c)=>T[k]&&T[k][1][0]!=null?`<div class="pl ${c}"><div style="font-size:26px">${['🥇','🥈','🥉'][k]}</div>${av(T[k][1][0],c=='p1'?84:64)}<div>${esc(P(T[k][1][0]).name)}</div></div>`:'<div></div>';
 return `<h2>🏆 ${fin?'Endplatzierung':'Zwischenstand (bereits ausgeschieden)'}</h2>`+(fin?`<div class="pod">${pc(1,'p2')}${pc(0,'p1')}${pc(2,'p3')}</div>`:'')
 +`<div class="card">${T.filter((t,i)=>!fin||i>2).map(([t,a])=>`<div class="rk"><i style="font-size:13px;width:60px">${t}</i><span>${a.map(i=>nm(i)).join('<br>')}</span></div>`).join('')||'<div class="q">Noch niemand ausgeschieden.</div>'}</div>`;
}
function render(){
 $('tabs').innerHTML=[['setup','👥','Spieler'],['groups','🎯','Gruppen'],['bracket','⚔️','Turnier'],['rank','🏆','Ränge']].map(([k,e,t])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';scrollTo(0,0);render()"><span>${e}</span>${t}</button>`).join('');
 $('undo').disabled=!H.length;
 $('app').innerHTML={setup:vSetup,groups:vGroups,bracket:vBracket,rank:vRank}[tab]();
}
load();tab=S.phase=='setup'?'setup':S.phase=='groups'?'groups':'bracket';render();
</script></body></html>
