<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f1f">
<meta name="robots" content="noindex">
<title>Smash Turnier</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0d0f1f;color:#f4f5ff;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.hero{position:relative;flex:1 1 46%;min-height:240px;background:linear-gradient(#0d0f1f33,#0d0f1f 96%),url(/hero.jpg) center 30%/cover;display:flex;align-items:flex-end;padding:20px 20px 6px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.hero h1{margin:0;font-size:clamp(38px,12vw,64px);font-weight:900;font-style:italic;line-height:.95;text-shadow:0 4px 18px #000c}
.hero h1 b{color:#ff2d55;display:block}
.panel{padding:8px 20px calc(28px + env(safe-area-inset-bottom,0px));max-width:480px;width:100%;margin:0 auto}
.panel p{margin:4px 0 16px;color:#9aa0c8;font-size:15px}
label{display:block;font-size:12px;font-weight:800;color:#9aa0c8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input{width:100%;padding:16px;font:inherit;font-size:20px;font-weight:800;letter-spacing:.18em;text-align:center;text-transform:uppercase;border:2px solid #2f3460;border-radius:16px;background:#1a1d36;color:#fff;outline:none}
input:focus{border-color:#ff2d55}
input.bad{border-color:#ff2d55;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
button{width:100%;margin-top:12px;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#ff2d55,#ff6a3d);color:#fff;font:inherit;font-weight:900;font-size:17px;box-shadow:0 6px 20px #ff2d5555}
button:disabled{opacity:.5}
#msg{min-height:22px;margin-top:10px;text-align:center;font-weight:700;color:#ff6b86;font-size:14px}
</style></head><body>
<div class="hero"><h1>SMASH<b>TURNIER</b></h1></div>
<form class="panel" id="f" autocomplete="off">
 <p>Willkommen! Gib den Zugangscode ein, den du von uns bekommen hast.</p>
 <label for="c">Zugangscode</label>
 <input id="c" type="text" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="••••••" autofocus>
 <button id="b" type="submit">🎮 Los geht's</button>
 <div id="msg" role="alert"></div>
</form>
<script>
const f=document.getElementById('f'),c=document.getElementById('c'),b=document.getElementById('b'),m=document.getElementById('msg');
f.addEventListener('submit',async e=>{
 e.preventDefault();if(!c.value.trim())return;
 b.disabled=true;m.textContent='';c.classList.remove('bad');
 try{
  const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c.value})});
  const j=await r.json().catch(()=>({}));
  if(r.ok&&j.ok){location.reload();return}
  m.textContent=j.error||'Das hat nicht geklappt.';c.classList.add('bad');
 }catch(err){m.textContent='Keine Verbindung zum Server.'}
 b.disabled=false;
});
</script></body></html>
